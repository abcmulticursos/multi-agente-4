# ─────────────────────────────────────────────────────────────────────────
# Configuración del flujo de bienvenida (saludo + intro data + pago)
# ─────────────────────────────────────────────────────────────────────────
# Para editar:
#   1. Cambia los textos / URLs aquí mismo en VS Code
#   2. git add config/intro-data.yaml
#   3. git commit -m "ajuste textos workflow"
#   4. git push
#   5. Deploy en EasyPanel
#
# Reglas:
#   - El símbolo "|" antes de un texto multilínea le dice a YAML que respete
#     los saltos de línea. NO QUITES ese símbolo en los textos largos.
#   - Los enlaces de Drive deben ser PÚBLICOS y < 25 MB.
#   - Mientras existan placeholders <<...>>, el flujo NO se ejecuta — útil
#     para deshabilitarlo temporalmente sin tocar código.
#
# VARIANTES DE TEXTO (anti-fingerprint Meta):
#   - Donde ves "body_variants:" o "caption_variants:", el bot elige UNA
#     opcion ALEATORIA al enviar, para reducir el patron de spam que detecta
#     Meta. Mientras solo una variante este completada, el bot usara esa
#     (las variantes con <<...>> se ignoran automaticamente).
#   - Cuando quieras agregar variacion: rellena las lineas que dicen
#     <<VARIANTE 2 — ...>> y <<VARIANTE 3 — ...>> con textos del MISMO
#     objetivo pero palabras distintas. Cuando todas esten completas, el
#     bot rotara entre las 3 opciones al azar.
# ─────────────────────────────────────────────────────────────────────────

