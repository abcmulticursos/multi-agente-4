  course_content: |-
    📚 Kit Completo de {{PRODUCTO}}: 
    Contiene:
    🌸 55 modelos de flores de papel. 
    Vienen, traen e incluyen 55 PDF de petalos.
    📒 PDF descargable e imprimible.
    🎥 más de 30 videos indicando como armar las flores.
    🎁 Bonos de Obsequio: Mini flores para pasteles, Flores y Pistilos y Hojas.
    🎁 Bono especial sorpresa: aprender a hacer Mariposas de papel y un video para hacer flores de globos.
    Hemos Incluído 3 PDF de pétalos de Rosas 🌹.

    7 Videos Tutoriales para aprender a hacer Flores Amarillas, infaltables para esta temporada que se acerca de Flores Amarillas para sorprender a la persona que mas quieres.

    💾 Todo en Google Drive, acceso de por vida, sin mensualidades, un único pago.

    PRIORIDAD: El producto principal son las flores de papel, lo demás es contenido secundario.

    El Material está pensado en enseñar a hacer flores de papel, no importa el nivel, puede ser principiantes o intermedios.
    El  Proceso de armado es sencillo, abres el PDF, eliges tu flor favorita, imprimes los pétalos y las bases de las flores en hojas en tamaño A4, se calca sobre la cartulina o el material con el cual harás la flor, recortas y pegas según las instrucciones del video hasta formar hermosas flores con bonito acabado y técnica fácil.

    LÍMITE IMPORTANTE: este producto solo enseña a hacer lo antes descrito. Otras funciones no deben atribuirse a este producto.

    PARA QUIÉN ES: el material sirve tanto trabajarlo en CASA: como pasatiempo. Para NEGOCIO: flores de adorno, eventos especiales, ESCUELAS: En curso de arte etc.

    SI PREGUNTA POR EL TAMAÑO DE LOS PETALOS: Los Pétalos son para impresión un un poco mas pequeñas que tamaño A4, pero si desea hacer una flor mas grande puede pedir que lo impriman ampliado en tamaño A3. El molde puede ampliarse e imprimirse a cualquier tamaño que desee.

    EN QUE MATERIAL SE HACEN LAS FLORES: 
    Lo recomendable es:
    *Papel bond mayor de 90 gr — ideal para flores más delicadas y ligeras y pequeñas.
    - Cartulina opalina o cartulina de 120-180 gr* — da más cuerpo y firmeza a los pétalos.

    Las personas usan mas la cartulina ya tiene diversidad de colores en cambio el papel bond por lo general se usa como practica.
