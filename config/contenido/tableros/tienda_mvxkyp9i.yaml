      steps:
        - type: text
          body_variants:
            - |-
              👋 *¡Hola, docente!* 😊 Somos el Equipo Oficial de Cocreando Online.

              ¿Te pasa que...?

              ⏰ Pasas horas preparando tus clases.
              🔎 Buscas actividades en diferentes lugares.
              📖 Tus estudiantes leen, pero no comprenden lo que leen.
              😴 La gramática y la ortografía les parecen aburridas.

              Si te identificaste con alguno, esto es para ti 👇
          delay_after_sec: 6
        - type: text
          body_variants:
            - |-
              Por eso creamos el
              📚 *{{PRODUCTO_BASE}}*

              Una colección digital con *más de 200 actividades, armables, plegables y recursos educativos* para enseñar Lengua de una manera mucho más visual, práctica y divertida. ✂️

              💡Ideal para tus alumnos de primaria y secundaria.
          delay_after_sec: 6
        - type: image
          drive_url: https://drive.google.com/file/d/14eFG1JoDfFaoRBCYjQ9hV3TC0hS2RqCd/view?usp=drive_link
          caption_variants:
            - ""
          delay_after_sec: 6
        - type: text
          body_variants:
            - |-
              📚 ¿Qué incluye el Megapack?
              _6 KITS COMPLETOS_

              📘 *KIT 1 — GRAMÁTICA EN ACCIÓN* ✅Sustantivos: clases, género y número
              ✅ Adjetivos y determinantes
              ✅ Pronombres
              ✅ Verbos: tiempos, modos y conjugación
              ✅ Adverbios, preposiciones y conjunciones
              ✅ Sujeto y predicado
              ✅ Tipos de oraciones
              ✅ Análisis morfológico y sintáctico

              ✏️ *KIT 2: ORTOGRAFÍA Y VOCABULARIO*
              ✅ Agudas, graves y esdrújulas
              ✅ Tilde diacrítica, diptongo e hiato
              ✅ B/V, C/S/Z, G/J, H, LL/Y, R/RR
              ✅ Signos de puntuación
              ✅ Mayúsculas
              ✅ Sinónimos, antónimos, homónimos y parónimos
              ✅ Prefijos, sufijos y familias de palabras
              ✅ Polisemia y sentido figurado

              📖 *KIT 3: COMPRENSIÓN LECTORA*
              ✅ Antes, durante y después de leer
              ✅ Idea principal, tema y resumen
              ✅ Comprensión literal e inferencial
              ✅ Secuencia, causa y consecuencia
              ✅ Subrayado, esquemas y mapas conceptuales
              ✅ Infografías, tablas y gráficos
              ✅ Hechos, opiniones y argumentos
              ✅ Lectura crítica y fuentes confiables
          delay_after_sec: 6
        - type: text
          body_variants:
            - |-
              📝 *KIT 4: ESCRITURA Y PRODUCCIÓN DE TEXTOS*
              ✅ Párrafos con coherencia y cohesión
              ✅ Conectores
              ✅ Planificar, redactar y corregir
              ✅ Cuentos y descripciones
              ✅ Informes e instructivos
              ✅ Ensayos, reseñas y argumentación
              ✅ Textos periodísticos
              ✅ Historietas, diálogos y guiones

              🎭 *KIT 5: LITERATURA EN ACCIÓN*
              ✅ Géneros literarios
              ✅ Cuento, novela, fábula, mito y leyenda
              ✅ Narrador, personajes, tiempo y espacio
              ✅ Poesía: verso, estrofa y rima
              ✅ Figuras literarias
              ✅ Teatro: actos, escenas y acotaciones
              ✅ Literatura latinoamericana 
              ✅ Análisis y creación literaria

              🗣️ *KIT 6: COMUNICACIÓN Y EXPRESIÓN ORAL*
              ✅ Elementos de la comunicación
              ✅ Comunicación verbal y no verbal
              ✅ Registros y variedades del lenguaje
              ✅ Escucha activa y diálogo
              ✅ Exposición oral
              ✅ Entrevista y debate
              ✅ Narración y dramatización
              ✅ Publicidad y ciudadanía digital
          delay_after_sec: 6
        - type: text
          body_variants:
            - |-
              ✂️ Dentro del material encontrarás:

              ⭐ Armables interactivos
              ⭐ Plegables y minilibros educativos
              ⭐ Crucigramas, pupiletras y sopas de letras
              ⭐ Juegos y dinámicas para trabajar en equipo
              ⭐ Actividades listas para imprimir
              ⭐ Respuestas y explicación detallada de cada armable

              _Ideal para primaria y secundaria - bachilerato_

              💡 Todo organizado para que tus estudiantes lean más, escriban mejor y disfruten aprender Lengua Y Literatura, mientras tú ahorras horas de preparación. 🤩
          delay_after_sec: 6
        - type: image
          drive_url: https://drive.google.com/file/d/1XyiZ-LT8K34JqlTc44c7iAac9bf3Olyh/view?usp=drive_link
          caption_variants:
            - ""
          delay_after_sec: 6
        - type: text
          body_variants:
            - |-
              ¡Y si adquieres COMUNICACIÓN Y LITERATURA EN ACCIÓN el día de hoy, te llevas 2 regalos especiales GRATIS! ⚡✨

              🎁 *BONO 1 · BANCO DE LECTURAS CON COMPRENSIÓN*

              📚 40 lecturas listas para imprimir, organizadas en 4 niveles de dificultad.
              👉 Ideal para tareas, evaluaciones y reforzar la comprensión lectora.

              🎁 *BONO 2 · +100 DINÁMICAS DE LECTURA Y ESCRITURA*

              🎯 102 actividades dinámicas para estudiantes de 10 a 15 años.
