          body_variants:
            - |-
              ¡Hola! Qué gusto tenerte por aquí 👋

              ¿Te ha pasado que a los 10 minutos de la tarea tu hijo o hija ya está distraído con el celular o la tele? 😔📱 Quieres que ese rato deje de ser una pelea y se convierta en algo que de verdad le ayude a aprender. ✨

              No es que sea flojo, es que nadie le ha enseñado *cómo* estimular su memoria y concentración.

              Te muestro algo que te va a ayudar. 👇
          delay_after_sec: 6
        - type: video
          drive_url: https://drive.google.com/file/d/1qTEau0efp_5gJoC_tW9rCrPmKo9KmEgJ/view?usp=drive_link
          caption_variants:
            - |-
              Te presento el *Kit de Estimulación y Gimnasia Cerebral.* 🚀

              El primer sistema basado en *TRIADA* :   el método que entrena la mente, acompaña la frustración y te da claridad sobre el desarrollo de tu hijo, los tres a la vez.

              Cada dinámica está pensada para sostener la atención en el único momento en que un niño realmente aprende: jugando, sin darse cuenta de que está aprendiendo.

              Más de 700 actividades, listas para usar desde hoy.
          delay_after_sec: 4
        - type: image
          drive_url: https://drive.google.com/file/d/1fIltKK0s1aQt3m43g-Vrl-i69pxP8UwM/view?usp=drive_link
          caption_variants:
            - |-
              Eso que te conté hoy tiene nombre: *Mi Guardería Lista* 💜

              *+120 actividades listas* para niños de 0 a 3 años, pensadas para lo que cada etapa necesita: sentidos, movimiento, lenguaje, música, creatividad y juego.

              Funciona así de simple: *abres, eliges y aplicas.*

              Cada actividad ya te dice qué hacer, qué materiales usar y qué estimula en el niño. Tú solo llegas al aula y empiezas ✨

              Y para que tengas la semana resuelta, uses materiales que ya tienes y *no te lleves más trabajo a casa*,
              también te llevas estos *bonos de regalo* 👇

              🎁 *Calendario de 30 Días*: sabes qué aplicar cada día
              🎁 *Planificador Semanal*: tu planificación lista para la directora
              🎁 *Carteles de Rutina para el Aula*: orden y calma en el día
              🎁 *Fichas de Observación Infantil*: registras el avance de cada niño
              🎁 *Guía de Acogida y Adaptación*: para el llanto de los primeros días
          delay_after_sec: 4
        - type: text
          body_variants:
            - |-
              Una sesión de estimulación en academia cuesta desde S/80 a más.

              Hoy te llevas *TODO EL KIT COMPLETO* por solo *S/10* — _(diez soles, pago único y acceso de por vida)_.

              Los que empiezan hoy son los que dejan de improvisar,  solo asignan una actividad a su hijo y empiezan⏳

               Aceptamos: 
              💳 *Yape o Plin*
              💳 *Transferencia*

              Nos envías el comprobante de pago por aquí 📸 y apenas lo confirmemos, te enviamos todo el material. 🙌
          delay_after_sec: 4
        - type: text
          body_variants:
            - ¿Con qué método de pago te gustaría adquirirlo? 😊
          delay_after_sec: 4
