# ─────────────────────────────────────────────────────────────────────────
# Secuencias de seguimiento (hasta 4) para clientes que no compran rápido.
#
# Funcionamiento:
#   - Al recibir el PRIMER mensaje del cliente (T0), se programan las 4
#     secuencias para los tiempos indicados en `delay_minutes_from_first_message`.
#   - Cada secuencia tiene sus propios `steps` (mismo formato que intro_sequence):
#       - type: text   → body + delay_after_sec
#       - type: audio  → drive_url + delay_after_sec
#       - type: image  → drive_url + caption + delay_after_sec
#       - type: video  → drive_url + caption + delay_after_sec
#   - Si el cliente paga antes de que una secuencia dispare → se cancela.
#   - Si una secuencia tiene placeholders <<...>>, NO se envía (dejala así
#     mientras prepares el contenido — el bot la salta silenciosamente).
#   - /restart cancela todas las pendientes.
#
# Para ajustar los TIEMPOS: cambia `delay_minutes_from_first_message`.
# Para AGREGAR pasos: copia/pega un bloque entero y ajusta type/body/url.
# ─────────────────────────────────────────────────────────────────────────
