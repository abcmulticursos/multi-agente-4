no_response_delay_seconds: 300

# Delay (segundos) entre mensajes consecutivos del bot.
# Aplica a las respuestas de pago (los 3 textos de Yape o BCP) y a
# cualquier respuesta del LLM que tenga doble salto de línea (\n\n).
# Subir = más natural pero más lento. Bajar = más rápido pero spam-feel.
between_messages_delay_seconds: 6

# Delay (segundos) que el bot espera antes de responder a un mensaje del
# cliente. Durante esos segundos, muestra "escribiendo…" en WhatsApp.
# Sirve para que no responda al instante (parece más humano).
# 0 = respuesta inmediata. Sugerido 5-7s. NO afecta a los mensajes
# programados (intro, pago aprobado) — esos tienen sus propios delays.
bot_response_delay_seconds: 6

# Tiempo (segundos) que pasa entre la petición del correo y el envío
# del audio + texto del regalo. Durante este tiempo, si el cliente
# pregunta cosas, el LLM le responde sin disparar el gift antes.
# Si el cliente da su correo en este lapso, también se captura y manda
# el email — pero el gift fire igual al cumplirse el tiempo.
# Sugerido 180-300s (3-5 min) para dar tiempo prudente al cliente.
awaiting_email_timeout_seconds: 300

# Precio del curso en soles. El bot acumula montos de comprobantes
# parciales hasta llegar a este número para aprobar la compra.
course_price_soles: 10

# Descuento progresivo: cuando arranca el seguimiento indicado (1-based,
# 1=seguimiento_1, 3=seguimiento_3, etc.) el precio del curso baja al
# valor `price_soles` para esa conversación en particular. La oferta
# queda activa para esa convo hasta que pague o le hagan /restart.
# El system prompt también ve este precio reducido y lo cita al cliente.
# Para DESACTIVAR el descuento, comentá las 3 líneas siguientes.
discount_after_followup:
  sequence_index: 3
  price_soles: 8

# Validación de comprobantes de pago.
payment_validation:
  # Para Yape/Plin: el nombre del receptor debe empezar con esto.
  # Yape oculta el apellido (ej. "Alberto S***"), Plin lo muestra completo.
  # Solo se valida el inicio para que ambos pasen.
  yape_recipient_name_starts_with: "Alberto"

