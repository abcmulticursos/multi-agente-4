                        ¡Hola! 😊 ¿Pudiste ver las *muestras gratuitas* de FIGURARTE? 🎨

                        Si no te llegaron bien, dime y te las vuelvo a enviar.
                    delay_after_sec: 4
          - id: fg2_rec2
            minutos: 360
            variantes:
              - id: fg2_rec2a
                nombre: Recordatorio 2
                peso: 1
                steps:
                  - type: text
                    body_variants:
                      - |-
                        Hola 💛 Paso rapidito por aquí: gracias a las contribuciones de personas como tú, este proyecto sigue creando material para colorear y aprender 🎨✨

                        Cuando puedas, haz tu aporte y envíame tu comprobante por aquí 📲
                    delay_after_sec: 4
          - id: fg2_rec3
            minutos: 720
            variantes:
              - id: fg2_rec3a
                nombre: Recordatorio 3
                peso: 1
                steps:
                  - type: text
                    body_variants:
                      - |-
                        Hola de nuevo ✨ Te recuerdo que con un aporte desde *S/15* recibes también los *bonos sorpresa* de FIGURARTE 🎁

                        Envía tu comprobante por aquí y te mando todo al instante 📲
                    delay_after_sec: 4
          - id: fg2_rec4
            minutos: 1380
            variantes:
              - id: fg2_rec4a
                nombre: Recordatorio 4
                peso: 1
                steps:
                  - type: text
                    body_variants:
                      - |-
                        Hola ✨ Paso por última vez para cerrar los registros de aportes 🙏

                        Te compartí el material por adelantado con mucha confianza. Si te gustó, tu contribución hace posible que este proyecto siga creciendo 💖
                    delay_after_sec: 4
