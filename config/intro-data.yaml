# ─────────────────────────────────────────────────────────────────────────
# Configuración global del SISTEMA de seguimientos (slots + reglas).
#
# Aplica únicamente a seguimientos 2 y 3 (el seguimiento 1 sigue siendo un
# delay fijo desde el primer mensaje del cliente, ver más abajo).
#
#   - slots_peru: horas (HH:MM, 24h, hora Perú UTC-5) en que pueden
#     dispararse los seguimientos 2 y 3 a lo largo del día.
#   - min_gap_hours_between: mínimo de horas que deben pasar entre el seg
#     anterior y el siguiente. Si el próximo slot está más cerca que esto,
#     se salta al siguiente slot disponible.
#   - burst_delays_seconds: cuando varias convos coinciden en el mismo
#     slot, sus envíos salen escalonados con estos delays (acumulativos
#     desde el slot base). La lista SE CICLA — al llegar al final, vuelve
#     al principio. Esto evita el patrón de ráfaga que WhatsApp marca como
#     spam.
#   - quiet_hours: ventana horaria silenciosa. Durante esta franja NO se
#     envían seguimientos 2/3. Si por la cola anti-ráfaga un envío caería
#     después de `start`, se DIFIERE al `resume_at` del día siguiente.
#     El seguimiento 1 ignora quiet_hours — dispara siempre.
# ─────────────────────────────────────────────────────────────────────────
followup_schedule:
  quiet_hours_enabled: false
  slots_peru:
    - 12:00
    - 18:00
    - 20:00
  min_gap_hours_between: 8
  burst_delays_seconds:
    - 15
    - 21
    - 27
    - 32
  quiet_hours:
    start: 23:55
    end: 07:00
    resume_at: 07:00
  followup_1_ignore_quiet_hours: false
  defer_late_leads_enabled: true
  defer_late_leads_after: 17:00

# ─────────────────────────────────────────────────────────────────────────
# Secuencias de seguimiento para clientes que no compran rápido.
#
# Funcionamiento:
#   - SEGUIMIENTO 1: se programa al recibir el primer mensaje del cliente,
#     usando `delay_minutes_from_first_message` (en minutos, típicamente 15).
#     Se manda a todos los clientes, ignora quiet_hours, y NO requiere que
#     el cliente haya respondido previamente.
#   - SEGUIMIENTOS 2 y 3: NO se programan al inicio. Solo se agendan cuando
#     el cliente envía un mensaje DESPUÉS del seguimiento anterior. Para
#     ellos no aplica `delay_minutes_from_first_message` — el momento de
#     envío lo decide `followup_schedule` (slots + regla 4h + quiet hours).
#   - Cada secuencia tiene sus propios `steps` (mismo formato que intro_sequence).
#   - Si el cliente paga antes de que una secuencia dispare → se cancela.
#   - Si una secuencia tiene placeholders <<...>>, NO se envía.
#   - /restart cancela todas las pendientes.
# ─────────────────────────────────────────────────────────────────────────
