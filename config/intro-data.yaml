workflows:
  figurarte2:
    encendido: true
    nombre: FIGURARTE 2
    cerebro: "Eres Rubén, asesor de la página Impulso 360 Digital. Ofreces FIGURARTE, un material en PDF para colorear con figuras geométricas (animales y personajes), por contribución: primero la persona recibe unas muestras gratuitas y después, si desea, aporta entre S/10 y S/30 y recibe el material completo y los bonos de su nivel. Hablas cálido, breve y con emojis, en español neutro."
    fichas:
      - id: fg2_inicio
        tipo: inicio
        x: 60
        y: 0
        titulo: Venta por contribución
      - id: fg2_presenta
        tipo: mensaje
        x: 390
        y: 0
        titulo: Presentación (botón SÍ)
        steps:
          - type: text
            body_variants:
              - |-
                ¡Hola! Rubén aquí, tu asesor de la página Impulso 360 Digital 👋 hoy te presento ARTEFIGURA 🎨✨.

                🤩 Un material único que transforma tu creatividad en arte. ¡Descúbrelo y diviértete! ❤️
            delay_after_sec: 4
          - type: text
            body_variants:
              - |-
                🎨✨ ¡FIGURARTE: COLOREA POR FIGURAS!🔺🟢✨

                Descubre una nueva forma de colorear donde las figuras geométricas se convierten en increíbles animales y personajes. 🐯🎨📚

                ¡Incluye todo lo siguiente

                🐯 Más de 80 animales para descubrir y colorear.
                🦸 Más de 30 personajes formados por figuras geométricas.
                🔵 Círculos, cuadrados, triángulos y rectángulos.
                🎨 Una forma diferente de colorear, ¡sin utilizar números!
                🟨 Figuras que se transforman en increíbles dibujos.
                🧠 Actividades que estimulan la creatividad y la atención.
                ✏️ Una experiencia divertida para aprender mientras coloreas.
                🌈 Diseños originales para dar vida con tus colores.
            delay_after_sec: 4
          - type: image
            drive_url: https://drive.google.com/file/d/1putAGUALd6qUNYn6tEWjY3P1DZRV8srM/view?usp=drive_link
            caption_variants: []
            delay_after_sec: 4
          - type: text
            body_variants:
              - |-
                🎁 Además, al adquirir FIGURARTE, recibes 4 BONOS SORPRESA GRATIS🎁🎨

                🔺🟢 Descubre una nueva forma de colorear con figuras geométricas y transforma círculos, cuadrados, triángulos y rectángulos en increíbles animales y personajes.

                📚🌎 Todo digital, en PDF y listo para recibir e imprimir.

                ⚠️ ¡Aprovecha esta promoción antes de que termine y disfruta de una forma diferente, creativa y divertida de colorear! 🎨✨
            delay_after_sec: 4
          - type: text
            body_variants:
              - |-
                🎨🐯 ¡Descubre FIGURARTE! 🦁🌈

                📚 Una forma divertida de aprender los colores, reconocer figuras y dejar volar la creatividad.

                ❤️ ¡Lo recibes primero y pagas después!

                Solo responde SÍ y te explico cómo recibirlo. 🥰
            delay_after_sec: 4
            buttons:
              - id: fg2_si
                label: SÍ
                action: send_steps
                steps: []
        presenta:
          - ptfig_figurarte
        instrucciones: "Aquí se presenta FIGURARTE. Si pregunta cómo funciona: primero le envías unas muestras gratuitas y después, si le gusta, hace una contribución voluntaria (S/10 a S/30) y recibe el material completo con bonos. Invítalo a responder SÍ para recibir las muestras."
        sin_respuesta_min: 120
      - id: fg2_insiste
        tipo: mensaje
        x: 390
        y: 330
        titulo: Si no contesta
        steps:
          - type: text
            body_variants:
              - ¿Sigues por ahí? 😊 Si quieres recibir *FIGURARTE*, solo responde *SÍ* y te envío las muestras gratuitas ahora mismo 🎨
            delay_after_sec: 4
      - id: fg2_si_msg
        tipo: mensaje
        x: 720
        y: 0
        titulo: Dijo que sí
        steps:
          - type: text
            body_variants:
              - ¡Perfecto! 😊 Te enviaré parte del material para que puedas revisarlos y comprobar la calidad del contenido. ✨
            delay_after_sec: 3
      - id: fg2_muestras
        tipo: entregar
        x: 1050
        y: 0
        titulo: Muestras gratuitas
        producto_id: ptfig_figurarte
        entregas:
          - ptfig_figurarte#muestras
      - id: fg2_cobro
        tipo: cobro
        x: 1380
        y: 0
        titulo: Contribución
        steps:
          - type: text
            body_variants:
              - |-
                🎨✨ ¡Ya tienes FIGURARTE! 🦁🌈

                💖 Si deseas apoyar este proyecto, puedes elegir una de las siguientes contribuciones:

                🎁 S/10 — CONTRIBUCIÓN SEMILLA
                📘 Material completo de FIGURARTE.

                🎁 S/15 — CONTRIBUCIÓN DE APOYO
                📘 Material completo + 🎁 1 bono.

                🎁 S/20 — CONTRIBUCIÓN ESPECIAL
                📘 Material completo + 🎁 los 2 bonos.

                🎁 S/25 — CONTRIBUCIÓN DE BENDICIÓN
                📘 Material completo + 🎁 3 bonos incluidos.

                🎁 S/30 — CONTRIBUCIÓN GENEROSA
                📘 Material completo + 🎁 todos los bonos + un aporte especial al proyecto.

                🙏 Tu apoyo ayuda a que este proyecto siga creciendo y llegue a más personas.

                🥰 ¡Gracias por tu generosidad y por apoyar este proyecto!
            delay_after_sec: 5
          - type: text
            body_variants:
              - |-
                🟣 Yape | 🟢 Plin
                {{CUENTA_YAPE}}
                Titular: {{NOMBRE_COMPLETO}}
            delay_after_sec: 3
          - type: text
            body_variants:
              - |-
                En cuanto realices tu aporte, envía tu comprobante por aquí, por WhatsApp. 📲

                🎁✨ Te enviaré el material completo + los bonos correspondientes a tu contribución.
            delay_after_sec: 4
        instrucciones: "Ya recibió las muestras gratuitas y los datos para contribuir. Si pregunta qué recibe o si tiene que pagar algo más, explícale con calma que con su aporte recibe el material completo de FIGURARTE y, según el monto, los bonos: S/10 el material; S/15 + 1 bono; S/20 + 2 bonos; S/25 + 3 bonos; S/30 todos los bonos + un aporte especial al proyecto. Contesta la duda con palabras: NO le vuelvas a ofrecer los métodos de pago ni le reenvíes los datos salvo que te los pida. Si dice que no vio o no le llegaron las muestras, reenvíaselas."
