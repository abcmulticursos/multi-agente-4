# ─────────────────────────────────────────────────────────────────────────
# Mecánica de PDF de regalo (Opción D):
#   1. Bot envía un AUDIO con la explicación del regalo (más cercano)
#   2. Bot envía un TEXTO con el link al post de Facebook (para que el
#      cliente pueda dar click directo y comentar sin salir de WhatsApp)
#   3. Cuando el cliente escribe "COMENTADO", recibe el reward_message
#      con el link bonus + felicitaciones.
#
# Mientras la sección tenga placeholders <<...>>, NO se activa.
# Necesitas llenar 3 cosas:
#   - El link de Drive del audio (graba, sube a Drive público, pega link)
#   - El link al post de FB que quieres que comenten
#   - El link de Drive del PDF bonus (dentro del reward_message)
# ─────────────────────────────────────────────────────────────────────────
gift_mechanic:
  # 0) PREGUNTA DE CONSENTIMIENTO: se envía PRIMERO. Solo si el cliente
  #    responde afirmativamente (sí, claro, me interesa, etc.) se manda
  #    el audio + ask_text. Si responde no, se cierra cordial. Si no
  #    responde, queda esperando indefinidamente sin molestar.
  consent_question: |
    🎁 *¿Deseas un Regalito Adicional extra* para complementar el aprendizaje de tu peque?

    Son unos *bonitos PDFs* que podrás descargar de manera totalmente gratuita 📚✨

    ¿Quieres descargar este Plus? 😊

  # Mensaje cordial cuando el cliente RECHAZA el regalo. Opcional —
  # si lo dejás vacío, no se envía nada y la convo queda en silencio.
  decline_message: |
    ¡Perfecto! ¡A disfrutar del material! 🎉 Éxitos con tu peque ✨

  # 1) AUDIO: graba tú el audio "hola mamita...", súbelo a Drive (público),
  #    y pega el link de "compartir" aquí.
  ask_audio_drive_url: "https://drive.google.com/file/d/1MdW0pW6RGSrzOvSpfv9LlExKMDjoZJ-j/view?usp=sharing"

  # 2) TEXTO con el link al post de FB. Llega después del audio.
  ask_text: |
    🎁 *PARA RECIBIR TU REGALITO ADICIONAL SIGUE ESTAS INSTRUCCIONES* 🎁

    1️⃣  📲 *Ingresa al Siguiente enlace*: 👇🏼

    https://www.facebook.com/61583751875359/posts/122136818799125062/

    2️⃣ ✍️ *Escríbenos un comentario positivo o recomendación* 😊

    3️⃣ 📝 Regresa aquí y escribe *"COMENTADO"* y te envío el enlace de obsequio al instante 🎁

  # 3) Respuesta cuando el cliente escribe "comentado" / "comenté" / etc.
  reward_message: |
    🎉 *¡Gracias por tu comentario!* 😊

    Aquí tienes tu *PDF de regalo* — un material extra para complementar el aprendizaje de tu hijo:

    https://drive.google.com/drive/folders/11u7uNnGpb_y7FY2CMs1VdRi92-SR09Rn?usp=drive_link

    *¡Felicitaciones en tu camino de aprendizaje!* 📚✨
